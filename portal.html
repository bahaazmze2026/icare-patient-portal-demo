<style>
:root{--navy:#142B45;--blue:#3769B2;--blue-600:#2F5E9E;--blue-700:#264F88;--blue-50:#EEF3FA;--green:#23AC7E;--green-700:#0F7A5C;--green-50:#E9F6F1;--amber-700:#8A5A00;--amber-50:#FFF6E0;--red-700:#B3333F;--red-50:#FDECEE;
--bg:#FAFBFC;--surface:#fff;--text:#142B45;--text-2:#5B6B7B;--border:#E3EAF0;--border-2:#CBD6E0;--disabled:#EDF1F5;--ring:0 0 0 3px #fff,0 0 0 5px var(--blue);
--r-s:10px;--r-m:14px;--r-l:20px;--sh:0 1px 2px rgba(20,43,69,.04),0 8px 24px rgba(20,43,69,.05);--f:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:400 16px/1.7 var(--f);color:var(--text);background:var(--bg);min-width:320px;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:0;box-shadow:var(--ring)}.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px #DCE7F6}.field input:focus-visible{box-shadow:none}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:var(--r-s);z-index:99}.skip:focus{top:8px}
.demo{background:var(--green-50);color:var(--green-700);font-size:13px;text-align:center;padding:5px 12px;border-bottom:1px solid #D3EBE2}
header.top{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.bar{max-width:1120px;margin:auto;height:60px;padding:0 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;border-radius:8px}.brand img{height:42px;width:auto;display:block}
.brand i{width:1px;height:26px;background:var(--border-2)}.brand span{font-size:15px;font-weight:600;color:var(--text)}
.sp{flex:1}.link{background:none;border:0;color:var(--blue-600);font-weight:500;font-size:15px;padding:10px 6px;border-radius:8px;min-height:44px}.link:hover{text-decoration:underline}
main{max-width:1120px;margin:auto;padding:0 20px}
/* patient */
.access{max-width:440px;margin:0 auto;padding:28px 0 40px}.access h1{font-size:27px;line-height:1.5;margin:0 0 6px;font-weight:600}.access p.lead{margin:0 0 20px;color:var(--text-2);font-size:15px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--sh);padding:22px}
.lbl{display:block;font-size:14px;font-weight:600;margin:0 0 6px}.field{display:flex;align-items:center;border:1px solid var(--border-2);border-radius:var(--r-m);background:#fff;min-height:52px;transition:border-color .15s,box-shadow .15s}
.field input{flex:1;min-width:0;border:0;background:none;outline:0;padding:0 14px;height:50px;font-size:16px;direction:ltr;text-align:left}.field input::placeholder{color:#7C8B99}
.field.err{border-color:var(--red-700)}.field button{border:0;background:none;width:48px;height:48px;color:var(--text-2);border-radius:12px;margin-inline-end:2px}
.hint{font-size:13px;color:var(--text-2);margin:6px 0 0}.msg{font-size:14px;color:var(--red-700);margin:6px 0 0;display:flex;gap:6px}.grp{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:var(--r-m);border:1px solid var(--border-2);background:#fff;font-weight:600;font-size:16px;text-decoration:none;color:var(--navy);transition:background .15s,transform .1s}
.btn:active{transform:scale(.985)}.btn.p{background:var(--blue-600);border-color:var(--blue-600);color:#fff}.btn.p:hover{background:var(--blue-700)}.btn.w{width:100%}.btn.s{min-height:44px;font-size:14px;padding:0 14px}
.btn[disabled]{background:var(--disabled);border-color:var(--disabled);color:#6E7C8A;cursor:not-allowed}.btn.load:before{content:"";width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
details.help{margin-top:14px;font-size:15px}details.help summary{cursor:pointer;color:var(--blue-600);font-weight:500;min-height:44px;display:flex;align-items:center;border-radius:8px;list-style:none}details.help summary::-webkit-details-marker{display:none}
.recpt{border:1px dashed var(--border-2);border-radius:var(--r-m);padding:14px;background:var(--bg);font-size:14px;margin-top:6px}.recpt div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.recpt small{color:var(--text-2)}
.note{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--text-2);margin:16px 0 0}
.foot{border-top:1px solid var(--border);padding:18px 20px;text-align:center;font-size:13px;color:var(--text-2)}.foot button{font-size:13px;min-height:44px}
.demobox{margin-top:14px;font-size:13px;color:var(--text-2);border-top:1px solid var(--border);padding-top:10px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{border:1px solid var(--border-2);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;min-height:36px}
/* results */
.res{max-width:560px;margin:0 auto;padding:22px 0 40px}.stat{display:flex;gap:14px;align-items:flex-start;border-radius:var(--r-l);padding:18px;border:1px solid}
.stat h1{font-size:22px;margin:0;line-height:1.5;font-weight:600}.stat p{margin:2px 0 0;font-size:15px}.stat .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:20px;font-weight:700}
.ok{background:var(--green-50);border-color:#CFEADF;color:#0B5E47}.wait{background:var(--blue-50);border-color:#D4E1F3;color:#1F4A80}.bad{background:var(--red-50);border-color:#F4CFD3;color:#8E2631}.warn{background:var(--amber-50);border-color:#F1DFB0;color:var(--amber-700)}
dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}dt{font-size:13px;color:var(--text-2)}dd{margin:0;font-weight:600;font-size:15px}.res .card{margin-top:14px}
.acts{display:grid;gap:10px;margin-top:16px}.acts.two{grid-template-columns:1fr 1fr}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-up{background:#EEF1F5;color:#47566A}.b-pen{background:var(--amber-50);color:var(--amber-700)}.b-app{background:var(--blue-50);color:#1F4A80}.b-pub{background:var(--green-50);color:var(--green-700)}.b-fail{background:var(--red-50);color:var(--red-700)}.b-rev{background:#F1EAF7;color:#5B3B7E}
/* dialog */
dialog{border:0;border-radius:var(--r-l);padding:0;max-width:min(560px,calc(100% - 24px));width:100%;box-shadow:0 20px 60px rgba(20,43,69,.25);color:var(--text)}dialog::backdrop{background:rgba(20,43,69,.45)}
dialog.full{max-width:min(760px,calc(100% - 16px))}.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}.dh h2{margin:0;font-size:18px}.db{padding:18px;max-height:70vh;overflow:auto}
.pdfw{background:#E9EEF3;border-radius:var(--r-m);padding:16px;overflow:auto;max-height:60vh}.pg{background:#fff;width:100%;max-width:520px;margin:auto;aspect-ratio:1/1.35;box-shadow:var(--sh);padding:7% 8%;transform-origin:top center;font-size:12px;position:relative;overflow:hidden}
.pg h3{margin:0 0 4px;font-size:15px}.ln{height:7px;background:#E1E8EF;border-radius:4px;margin:10px 0}.wm{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:700;color:#14355B14;transform:rotate(-24deg);pointer-events:none;text-align:center}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}.tools span{font-size:14px;min-width:48px;text-align:center}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:420px;margin:auto;background:var(--navy);color:#fff;border-radius:var(--r-m);padding:12px 16px;font-size:14px;z-index:50}
/* admin */
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding:20px 0 90px}nav.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px;align-self:start}
nav.side button{display:flex;align-items:center;gap:10px;text-align:start;background:none;border:0;border-radius:var(--r-s);padding:0 12px;min-height:44px;font-size:15px;color:var(--text-2)}nav.side button[aria-current=page]{background:var(--blue-50);color:var(--blue-700);font-weight:600}nav.side button:hover{background:#F1F5F9}
nav.bot{display:none}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{padding:16px}.kpi b{display:block;font-size:28px;line-height:1.2}.kpi span{font-size:13px;color:var(--text-2)}
h2.t{font-size:20px;margin:0 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sel{border:1px solid var(--border-2);border-radius:var(--r-m);min-height:48px;padding:0 12px;background:#fff;width:100%;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:13px;color:var(--text-2);font-weight:500;text-align:start;padding:10px 12px;border-bottom:1px solid var(--border)}td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}tr:last-child td{border:0}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 18px;counter-reset:s}.steps li{flex:1;font-size:13px;color:var(--text-2);border-top:3px solid var(--border);padding-top:6px}.steps li.on{border-color:var(--blue);color:var(--text);font-weight:600}.steps li.done{border-color:var(--green)}
.drop{border:1.5px dashed var(--border-2);border-radius:var(--r-m);padding:22px;text-align:center;background:var(--bg)}.chk{display:flex;gap:8px;font-size:14px;padding:3px 0}.chk.y{color:var(--green-700)}.chk.n{color:var(--red-700)}
@media(max-width:820px){.adm{grid-template-columns:1fr;padding-bottom:96px}nav.side{display:none}nav.bot{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:12}
nav.bot button{background:none;border:0;min-height:52px;font-size:12px;color:var(--text-2);border-radius:10px}nav.bot button[aria-current=page]{color:var(--blue-700);font-weight:700;background:var(--blue-50)}.kpis{grid-template-columns:1fr 1fr}
table,tbody,tr,td{display:block}thead{display:none}tr{border:1px solid var(--border);border-radius:var(--r-m);padding:10px 12px;margin-bottom:10px;background:#fff}td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:10px}td:before{content:attr(data-l);color:var(--text-2);font-size:13px}}
.top:after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--blue),var(--green))}
.access h1 em{font-style:normal;color:var(--blue-600)}
.tk{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:#fff;border:1px solid var(--border);border-radius:var(--r-m);padding:14px 14px 10px;margin-bottom:12px;position:relative;overflow:hidden}
.tk:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--blue) 50%,var(--green) 50%)}
.tk small{display:block;color:var(--text-2);font-size:12px}.tk b{font-size:14px}.tk em{grid-column:1/-1;font-style:normal;font-size:12px;color:var(--text-2);border-top:1.5px dashed var(--border-2);padding-top:6px;margin-top:4px}
.n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--blue-50);color:var(--blue-700);font-size:11px;font-weight:700;margin-inline-end:6px}
.tl{display:flex;list-style:none;margin:16px 0 0;padding:0;gap:4px}.tl li{flex:1;font-size:12px;color:var(--text-2);text-align:center;position:relative;padding-top:20px}
.tl li:before{content:"";position:absolute;top:0;inset-inline:0;margin:auto;width:14px;height:14px;border-radius:50%;background:var(--border-2)}.tl li:after{content:"";position:absolute;top:6px;inset-inline-start:50%;width:100%;height:2px;background:var(--border-2);z-index:-1}.tl li:last-child:after{display:none}
.tl li.d{color:var(--green-700)}.tl li.d:before{background:var(--green)}.tl li.d:after{background:var(--green)}.tl li.c{color:var(--blue-700);font-weight:700}.tl li.c:before{background:var(--blue);box-shadow:0 0 0 4px #DCE7F6}
.doc{display:flex;gap:14px;align-items:center}.seal{flex:none;width:52px;height:64px;border-radius:8px;border:1px solid var(--border-2);background:linear-gradient(#fff,#F4F7FA);display:grid;place-items:center;position:relative}.seal:after{content:"✓";position:absolute;bottom:-8px;inset-inline-end:-8px;width:24px;height:24px;border-radius:50%;background:var(--green-700);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}.seal b{font-size:11px;color:var(--blue-700)}
.doc h2{font-size:17px;margin:0}.doc p{margin:0;font-size:13px;color:var(--text-2)}
.kpi{border-top:3px solid var(--blue)}.kpi:nth-child(1){border-top-color:var(--green)}.kpi:nth-child(3){border-top-color:var(--red-700)}.kpi:nth-child(4){border-top-color:#C98A00}
@media(max-height:700px){.tk em,.access p.lead{display:none}.access{padding-top:14px}}
@media(min-width:900px){.access{padding-top:56px}.access h1{font-size:34px}}
@media(max-width:360px){.access h1{font-size:25px}.acts.two{grid-template-columns:1fr}.brand span{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}

if(tab==='usr')b=`<h2 class="t">المستخدمون والصلاحيات</h2><div class="card">${T(['الدور','رفع','مراجعة','نشر','إلغاء','إدارة'],[['موظف رفع','✓','—','—','—','—'],['مراجع','—','✓','—','—','—'],['مسؤول معمل','✓','✓','✓','✓','—'],['مسؤول النظام','—','—','—','—','✓']])}</div><p class="hint">فصل المهام: من يرفع لا يعتمد. عرض فقط في النموذج التجريبي.</p>`;
if(tab==='set')b=`<h2 class="t">الإعدادات</h2><div class="card">${T(['الإعداد','القيمة'],[['مهلة الجلسة','10 دقائق'],['حد محاولات الدخول','5 ثم قفل مؤقت'],['أقصى حجم PDF','10MB'],['عرض الإصدارات القديمة للمريض','لا'],['مشاركة عامة للتقارير','معطّلة دائمًا']])}</div><p class="hint">للقراءة فقط في النموذج التجريبي.</p>`;
if(tab==='up'){const S=['اختيار الزيارة','التحقق من الملف','المراجعة','النشر'];
b=`<h2 class="t">رفع يدوي</h2><ol class="steps">${S.map((s,i)=>`<li class="${i+1===step?'on':i+1<step?'done':''}" ${i+1===step?'aria-current="step"':''}>${s}</li>`).join('')}</ol><div class="card">`;
if(step===1)b+=`<label class="lbl" for="sv">الزيارة</label><select class="sel" id="sv"><option value="">اختر…</option>${V.filter(x=>x[1]!=='rev').map(x=>`<option ${up.visit===x[0]?'selected':''}>${x[0]}</option>`).join('')}</select><div class="acts"><button class="btn p" id="n1">التالي</button></div>`;
if(step===2){const f=up.file,okT=f&&f.type==='application/pdf',okS=f&&f.size<10e6;b+=`<div class="drop"><label class="lbl" for="pf">ملف PDF المعتمد من i-CARE</label><input type="file" id="pf" accept="application/pdf"></div>${f?`<div class="chk ${okT?'y':'n'}">${okT?'✓':'✕'} النوع PDF</div><div class="chk ${okS?'y':'n'}">${okS?'✓':'✕'} الحجم أقل من 10MB</div>`:''}<div class="acts two"><button class="btn" id="b">رجوع</button><button class="btn p" id="n2" ${okT&&okS?'':'disabled'}>التالي</button></div>`}
if(step===3){const v=V.find(x=>x[0]===up.visit),ap=v&&['app','pub'].includes(v[1]);b+=`<dl><div><dt>الزيارة</dt><dd class="ltr">${up.visit}</dd></div><div><dt>الملف</dt><dd class="ltr">${up.file.name}</dd></div><div><dt>حالة الاعتماد</dt><dd>${bg(v[1])}</dd></div></dl>${ap?'':`<p class="msg" role="alert">لا يمكن النشر قبل اعتماد التقرير. سيُرسل للمراجعة فقط.</p>`}<div class="acts two"><button class="btn" id="b">رجوع</button><button class="btn p" id="n3">${ap?'متابعة للنشر':'إرسال للمراجعة'}</button></div>`}
if(step===4){const v=V.find(x=>x[0]===up.visit),ap=['app','pub'].includes(v[1]);b+=`<p>${ap?'سيُنشر الإصدار الجديد ويُحفظ القديم في السجل.':'تم الرفع. التقرير بانتظار المراجعة ولن يظهر للمريض.'}</p><div class="acts"><button class="btn p" id="n4">${ap?'نشر (تجريبي)':'تم'}</button></div>`}
b+='</div>'}
main.innerHTML=`<div class="adm">${nav('side')}<section>${b}</section></div>${nav('bot')}`;
document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{tab=x.dataset.t;admin()});
const on=(i,f)=>{const e=$('#'+i);if(e)e.onclick=f},go=n=>{step=n;admin()};
on('n1',()=>{up.visit=$('#sv').value;up.visit?go(2):toast('اختر زيارة أولًا')});on('b',()=>go(step-1));on('n2',()=>go(3));on('n3',()=>go(4));on('n4',()=>{toast('تم (محاكاة). لم يُرسل أي ملف.');step=1;up={visit:'',file:null};admin()});on('rtry',()=>toast('تمت جدولة إعادة المحاولة (محاكاة).'));
document.querySelectorAll('[data-cor]').forEach(x=>x.onclick=()=>{cor={visit:x.dataset.cor,step:1,file:null,reason:'',ref:'',ok:false};tab='corr';admin()});
const cs=n=>{cor.step=n;admin()};on('cx',()=>{tab='rep';admin()});on('cb',()=>cs(cor.step-1));
on('c1',()=>{cor.reason=$('#rs').value;cor.reason?cs(2):toast('اختر سبب التصحيح')});on('c2',()=>cs(3));on('c3',()=>cs(4));
const cf=$('#cf'),cr=$('#cr');if(cr)cr.oninput=()=>{cor.ref=cr.value.trim();$('#c2').disabled=!(cor.file&&cor.file.type==='application/pdf'&&cor.file.size<10e6&&cor.ref.length>=6)};
if(cf)cf.onchange=()=>{cor.ref=$('#cr').value.trim();cor.file=cf.files[0]||null;admin()};
const ck=$('#ck');if(ck)ck.onchange=()=>{$('#c4').disabled=!ck.checked};
on('c4',()=>{const v=V.find(x=>x[0]===cor.visit);v[2]='v'+((parseInt(v[2].slice(1))||1)+1);v[3]='الآن';addLog('نشر نسخة مصححة',v[0]);toast('تم النشر (محاكاة). لم يُرسل أي ملف.');tab='rep';admin()});
const st=(a,s,l)=>document.querySelectorAll(a).forEach(x=>x.onclick=()=>{const v=V.find(y=>y[0]===x.dataset[a.slice(6,8)]);v[1]=s;v[3]='الآن';addLog(l,v[0]);admin()});
st('[data-ap]','app','اعتماد');st('[data-rj]','rej','رفض');st('[data-pb]','pub','نشر');
const lq=$('#lq');if(lq)lq.oninput=()=>{const k=lq.value.trim().toUpperCase();$('#lt').innerHTML=T(['الوقت','المستخدم','الإجراء','الزيارة'],LG.filter(r=>(r[2]+r[3]).toUpperCase().includes(k)).map(r=>[r[0],r[1],r[2],`<span class="ltr">${r[3]}</span>`]))};
on('more',()=>{open(`<div class="dh"><h2 id="dt">المزيد</h2><button class="btn s" data-close>إغلاق</button></div><div class="db" style="display:grid;gap:8px">${TABS.slice(4).map(x=>`<button class="btn" data-t2="${x[0]}">${x[1]}</button>`).join('')}</div>`);dlg.querySelectorAll('[data-t2]').forEach(x=>x.onclick=()=>{dlg.close();tab=x[ 'dataset'].t2;admin()})});
const pf=$('#pf');if(pf)pf.onchange=()=>{up.file=pf.files[0]||null;admin();};
const q=$('#q');if(q)q.oninput=()=>{const t=q.value.trim().toUpperCase();$('#tb').innerHTML=tbl(V.filter(x=>x[0].includes(t)))}}
$('#home').onclick=()=>sess?result(sess.s):login();$('#hb').onclick=help;
login();
</script><a href="./" class="backsite" aria-label="العودة إلى الموقع الرئيسي">↗ العودة للموقع الرئيسي</a></body></html>
